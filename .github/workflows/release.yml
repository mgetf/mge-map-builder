name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build:stable

      - name: Find installer
        id: installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path artifacts, build -Recurse -Filter "*-Setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) { Write-Error "No Windows setup executable found"; exit 1 }
          echo "Found: $($installer.FullName)"
          echo "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload installer
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.installer.outputs.path }}
          generate_release_notes: true
